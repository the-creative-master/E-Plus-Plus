<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>E++ IDE</title>
<meta name="description" content="The official online IDE for E++, the programming language that looks like English, reads like English, and behaves like code.">
<link rel="stylesheet" href="css/ide.css?v=13">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>E</text></svg>">
</head>
<body>

<!--
  The E++ IDE has no hardbaked interface.

  * The chrome (top bar, dashboard, sidebar, editor, console, drawing, status
    bar, footer, dialogs) is built by js/shell.js from the UI manifest:
    ui/manifest.json over http(s), js/ui-shell.js offline.
  * Settings are built from the settings schema: settings/schema.json
    (js/settings-schema.js offline) — see js/settings.js.
  * Tutorial lessons come from the lesson pack: tutorial/pack.json
    (js/tutorial-pack.js offline) — see js/tutorial.js.

  So this file is only the entry point: a host element and the scripts.
-->
<div id="appRoot"></div>

<script src="js/errors.js?v=13"></script>
<script src="js/lexer.js?v=13"></script>
<script src="js/ast.js?v=13"></script>
<script src="js/libraries.js?v=13"></script>
<script src="js/parser.js?v=13"></script>
<script src="js/python-runner.js?v=13"></script>
<script src="js/interpreter.js?v=13"></script>
<script src="js/files.js?v=13"></script>
<script src="js/highlight.js?v=13"></script>
<script src="js/standalone-generator.js?v=13"></script>
<script src="js/tutorial-pack.js?v=13"></script>
<script src="js/tutorial.js?v=13"></script>
<script src="js/settings-schema.js?v=13"></script>
<script src="js/settings.js?v=13"></script>
<script src="js/ui-shell.js?v=13"></script>
<script src="js/shell.js?v=13"></script>
<script src="js/ide.js?v=13"></script>
</body>
</html>
