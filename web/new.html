<section class="panel narrow">
  <h1>{{t:files.new}}</h1>
  <form method="post" action="/new">
    <label for="name">{{t:files.nameLabel}}</label>
    <input id="name" name="name" value="{{example}}" required>
    <button type="submit" class="primary">{{t:ui.create}}</button>
    <a class="button" href="/">{{t:ui.cancel}}</a>
  </form>
</section>
